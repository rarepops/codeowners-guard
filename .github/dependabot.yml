version: 2

updates:
  # Runtime and development packages move together so the lockfile stays easy
  # to review. Node type majors are excluded because they define the oldest
  # CLI runtime that TypeScript is allowed to assume.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      npm-dependencies:
        patterns:
          - "*"
    ignore:
      - dependency-name: "@types/node"
        update-types:
          - "version-update:semver-major"
    commit-message:
      prefix: build

  # Keep every immutable workflow pin current in one reviewable PR.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      workflow-actions:
        patterns:
          - "*"
    commit-message:
      prefix: ci
