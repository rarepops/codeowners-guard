version: 2

# npm packages and workflow pins arrive together in one monthly PR. Security
# updates still open their own PRs as soon as an advisory lands.
multi-ecosystem-groups:
  dependencies:
    schedule:
      interval: monthly
    commit-message:
      prefix: build

updates:
  # Node type majors are excluded because they define the oldest CLI runtime
  # that TypeScript is allowed to assume.
  - package-ecosystem: npm
    directory: /
    patterns:
      - "*"
    multi-ecosystem-group: dependencies
    ignore:
      - dependency-name: "@types/node"
        update-types:
          - "version-update:semver-major"

  - package-ecosystem: github-actions
    directory: /
    patterns:
      - "*"
    multi-ecosystem-group: dependencies
