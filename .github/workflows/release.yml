name: Release

on:
  push:
    tags:
      - "v*.*.*"
  # Manual runs build and retain the exact release artifacts for inspection,
  # but only a version tag publishes a GitHub release.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.package.outputs.version }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm

      - run: npm ci
      - run: npm run check
      - name: Audit dependencies
        run: npm audit
      - name: Verify package signatures
        run: npm audit signatures
      - name: Verify committed bundles
        run: git diff --exit-code -- dist THIRD_PARTY_NOTICES.md

      - name: Resolve package version
        id: package
        run: |
          version="$(node -p "require('./package.json').version")"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "package.json version must use X.Y.Z format" >&2
            exit 1
          fi
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"

      - name: Verify tag matches package version
        if: github.ref_type == 'tag'
        env:
          PACKAGE_VERSION: ${{ steps.package.outputs.version }}
        run: test "v$PACKAGE_VERSION" = "$GITHUB_REF_NAME"

      - name: Verify tag commit belongs to main
        if: github.ref_type == 'tag'
        run: |
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          git merge-base --is-ancestor "$GITHUB_SHA" refs/remotes/origin/main

      - name: Build CLI package
        run: |
          mkdir release
          npm pack --pack-destination release

      - name: Compute checksums
        working-directory: release
        run: sha256sum *.tgz > SHA256SUMS.txt

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: codeowners-guard-${{ steps.package.outputs.version }}
          path: release/*
          retention-days: 14

  release:
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      attestations: write
      contents: write
      id-token: write
    steps:
      - name: Download validated artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: codeowners-guard-${{ needs.build.outputs.version }}
          path: release

      - name: Set up Node.js for npm trusted publishing
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Verify artifact checksums
        working-directory: release
        run: sha256sum --check SHA256SUMS.txt

      - name: Attest release artifacts
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: release/*

      - name: Publish package to npm
        working-directory: release
        env:
          RELEASE_VERSION: ${{ needs.build.outputs.version }}
        run: |
          package="codeowners-guard-$RELEASE_VERSION.tgz"
          expected_integrity="$(node -e 'const { createHash } = require("node:crypto"); const { readFileSync } = require("node:fs"); process.stdout.write(`sha512-${createHash("sha512").update(readFileSync(process.argv[1])).digest("base64")}`)' "$package")"
          published_integrity="$(npm view "codeowners-guard@$RELEASE_VERSION" dist.integrity 2>/dev/null || true)"

          if [[ -n "$published_integrity" ]]; then
            if [[ "$published_integrity" != "$expected_integrity" ]]; then
              echo "npm already contains codeowners-guard@$RELEASE_VERSION with different contents" >&2
              exit 1
            fi
            echo "codeowners-guard@$RELEASE_VERSION is already published with matching integrity"
          else
            npm publish "$package" --access public
          fi

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ needs.build.outputs.version }}
        run: >
          gh release create "$GITHUB_REF_NAME" release/*
          --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes
          --title "CODEOWNERS Guard $RELEASE_VERSION"
